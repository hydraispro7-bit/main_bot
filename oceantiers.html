<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OceanTiers Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #060913 0%, #0b1329 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(6, 9, 19, 0.9);
            border-bottom: 1px solid rgba(0, 180, 213, 0.15);
        }
        .logo {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span {
            color: #00b4d5;
        }
        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .nav-links a {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 600;
            font-size: 14px;
        }
        .manage-btn {
            background: linear-gradient(135deg, #0077b6, #00b4d5);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 180, 213, 0.3);
        }
        .mode-bar {
            display: flex;
            gap: 10px;
            padding: 20px 40px;
            overflow-x: auto;
            background-color: rgba(6, 9, 19, 0.6);
            border-bottom: 1px solid rgba(0, 180, 213, 0.1);
        }
        .mode-btn {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(30, 41, 59, 1);
            color: #94a3b8;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #0077b6, #00b4d5);
            color: white;
            border-color: #00b4d5;
        }
        .container {
            padding: 30px 40px;
        }
        .table-wrapper {
            background-color: rgba(11, 19, 41, 0.7);
            border: 1px solid rgba(0, 180, 213, 0.15);
            border-radius: 12px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            padding: 18px 24px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.8);
        }
        td {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.4);
            font-size: 15px;
            vertical-align: middle;
        }
        .rank {
            font-weight: bold;
            color: #94a3b8;
            width: 60px;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .player-avatar {
            width: 38px;
            height: 38px;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(0, 180, 213, 0.3);
        }
        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-name {
            font-weight: 600;
            color: white;
        }
        .region-badge {
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(30, 41, 59, 1);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #cbd5e1;
        }
        .player-tiers {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tier-card {
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .tier-card .gm-icon {
            font-size: 11px;
            color: #94a3b8;
        }
        .tier-card .tier-val {
            font-size: 11px;
            font-weight: bold;
            color: #ef4444;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .modal-box {
            background-color: #0b1329;
            border: 1px solid rgba(0, 180, 213, 0.3);
            width: 420px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.8);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title {
            color: #00b4d5;
            font-size: 18px;
            font-weight: bold;
        }
        .close-btn {
            background: none;
            border: none;
            color: #64748b;
            font-size: 22px;
            cursor: pointer;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .input-group input, .input-group select {
            width: 100%;
            background-color: #060913;
            border: 1px solid rgba(30, 41, 59, 1);
            padding: 10px 14px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #0077b6, #00b4d5);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .danger-btn {
            background: linear-gradient(135deg, #b91c1c, #ef4444);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌊 OCEAN<span>TIERS</span></div>
        <div class="nav-links">
            <button class="manage-btn" onclick="openAdminModal()">⚡ Manage Tiers</button>
            <a href="#">Rankings</a>
            <a href="#">Discords</a>
        </div>
    </header>

    <div class="mode-bar" id="modeBar">
        <button class="mode-btn active" data-mode="Overall">🏆 Overall</button>
        <button class="mode-btn" data-mode="Sword">🗡️ Sword</button>
        <button class="mode-btn" data-mode="NethPot">🔮 NethPot</button>
        <button class="mode-btn" data-mode="SMP">🛡️ SMP</button>
        <button class="mode-btn" data-mode="DiaPot">⚔️ DiaPot</button>
        <button class="mode-btn" data-mode="Crystal">💎 Crystal</button>
        <button class="mode-btn" data-mode="Mace">🔨 Mace</button>
        <button class="mode-btn" data-mode="Spear">🔱 Spear</button>
        <button class="mode-btn" data-mode="UHC">❤️ UHC</button>
        <button class="mode-btn" data-mode="Axe">🪓 Axe</button>
    </div>

    <div class="container">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Player</th>
                        <th>Region</th>
                        <th>Tiers</th>
                    </tr>
                </thead>
                <tbody id="playerTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Admin Choice Modal -->
    <div class="modal-overlay" id="modalChoice">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title">🔒 Admin Panel</div>
                <button class="close-btn" onclick="closeAll()">×</button>
            </div>
            <div id="authChoice">
                <div class="input-group">
                    <label>Enter Admin Password</label>
                    <input type="password" id="passChoice" placeholder="Password daal...">
                </div>
                <button class="action-btn" onclick="unlockAdmin()">Login</button>
            </div>
            <div id="optionsChoice" style="display: none;">
                <button class="action-btn" style="margin-bottom: 12px;" onclick="showAddForm()">➕ Add / Update Player Tier</button>
                <button class="action-btn danger-btn" onclick="showRevokeForm()">🗑️ Revoke / Restrict Player</button>
            </div>
        </div>
    </div>

    <!-- Modal Add -->
    <div class="modal-overlay" id="modalAdd">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title">➕ Add / Update Player</div>
                <button class="close-btn" onclick="closeAll()">×</button>
            </div>
            <div class="input-group">
                <label>IGN</label>
                <input type="text" id="ignInput" placeholder="Minecraft IGN...">
            </div>
            <div class="input-group">
                <label>Region</label>
                <select id="regionSelect">
                    <option value="ME">ME</option>
                    <option value="AS">AS</option>
                    <option value="EU">EU</option>
                    <option value="NA">NA</option>
                </select>
            </div>
            <div class="input-group">
                <label>Gamemode</label>
                <select id="gmSelect">
                    <option value="Sword">Sword</option>
                    <option value="NethPot">NethPot</option>
                    <option value="SMP">SMP</option>
                    <option value="DiaPot">DiaPot</option>
                    <option value="Crystal">Crystal</option>
                    <option value="Mace">Mace</option>
                    <option value="Spear">Spear</option>
                    <option value="UHC">UHC</option>
                    <option value="Axe">Axe</option>
                </select>
            </div>
            <div class="input-group">
                <label>Tier</label>
                <select id="tierSelect">
                    <option value="HT1">HT1</option>
                    <option value="HT2">HT2</option>
                    <option value="HT3">HT3</option>
                    <option value="HT4">HT4</option>
                    <option value="HT5">HT5</option>
                    <option value="LT1">LT1</option>
                    <option value="LT2">LT2</option>
                    <option value="LT3">LT3</option>
                    <option value="LT4">LT4</option>
                    <option value="LT5">LT5</option>
                </select>
            </div>
            <button class="action-btn" onclick="savePlayer()">Save Tier</button>
        </div>
    </div>

    <!-- Modal Revoke -->
    <div class="modal-overlay" id="modalRevoke">
        <div class="modal-box" style="border-color: #ef4444;">
            <div class="modal-header">
                <div class="modal-title" style="color: #ef4444;">🗑️ Revoke Tier / Restrict</div>
                <button class="close-btn" onclick="closeAll()">×</button>
            </div>
            <div class="input-group">
                <label>Player IGN</label>
                <input type="text" id="revokeIgn" placeholder="Exact IGN...">
            </div>
            <div class="input-group">
                <label>Gamemode to Revoke</label>
                <select id="revokeGm">
                    <option value="Sword">Sword</option>
                    <option value="NethPot">NethPot</option>
                    <option value="SMP">SMP</option>
                    <option value="DiaPot">DiaPot</option>
                    <option value="Crystal">Crystal</option>
                    <option value="Mace">Mace</option>
                    <option value="Spear">Spear</option>
                    <option value="UHC">UHC</option>
                    <option value="Axe">Axe</option>
                </select>
            </div>
            <button class="action-btn danger-btn" onclick="revokeTier()">Revoke / Restrict</button>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('ocean_players')) || [];
        let currentFilter = 'Overall';

        renderTable();

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-mode');
                renderTable();
            });
        });

        function openAdminModal() {
            document.getElementById('modalChoice').style.display = 'flex';
            document.getElementById('passChoice').value = '';
            document.getElementById('authChoice').style.display = 'block';
            document.getElementById('optionsChoice').style.display = 'none';
        }

        function closeAll() {
            document.getElementById('modalChoice').style.display = 'none';
            document.getElementById('modalAdd').style.display = 'none';
            document.getElementById('modalRevoke').style.display = 'none';
        }

        function unlockAdmin() {
            if(document.getElementById('passChoice').value === 'hydraawasandispro') {
                document.getElementById('authChoice').style.display = 'none';
                document.getElementById('optionsChoice').style.display = 'block';
            } else {
                alert('Galat Password!');
            }
        }

        function showAddForm() {
            document.getElementById('modalChoice').style.display = 'none';
            document.getElementById('modalAdd').style.display = 'flex';
        }

        function showRevokeForm() {
            document.getElementById('modalChoice').style.display = 'none';
            document.getElementById('modalRevoke').style.display = 'flex';
        }

        function savePlayer() {
            let ign = document.getElementById('ignInput').value.trim();
            let region = document.getElementById('regionSelect').value;
            let gm = document.getElementById('gmSelect').value;
            let tier = document.getElementById('tierSelect').value;

            if(!ign) return alert('IGN daal!');

            let p = players.find(x => x.ign.toLowerCase() === ign.toLowerCase());
            if(p) {
                p.region = region;
                let tIdx = p.tiers.findIndex(t => t.gm === gm);
                if(tIdx > -1) p.tiers[tIdx].tier = tier;
                else p.tiers.push({gm, tier});
            } else {
                players.push({ ign, region, tiers: [{gm, tier}] });
            }

            localStorage.setItem('ocean_players', JSON.stringify(players));
            renderTable();
            closeAll();
            alert('Player tier successfully save ho gaya!');
        }

        function revokeTier() {
            let ign = document.getElementById('revokeIgn').value.trim();
            let gm = document.getElementById('revokeGm').value;

            if(!ign) return alert('IGN daal!');

            let pIdx = players.findIndex(x => x.ign.toLowerCase() === ign.toLowerCase());
            if(pIdx === -1) return alert('Player nahi mila!');

            let p = players[pIdx];
            let tIdx = p.tiers.findIndex(t => t.gm === gm);
            if(tIdx === -1) return alert('Is gamemode ka tier nahi hai!');

            p.tiers.splice(tIdx, 1);
            if(p.tiers.length === 0) players.splice(pIdx, 1);

            localStorage.setItem('ocean_players', JSON.stringify(players));
            renderTable();
            closeAll();
            alert('Tier successfully revoke / restrict kar diya!');
        }

        function getScore(tier) {
            let m = tier.match(/([HL]T)(\d)/i);
            if(!m) return 0;
            return (m[1].toUpperCase() === 'HT' ? 100 : 50) + (6 - parseInt(m[2]));
        }

        function renderTable() {
            players.sort((a, b) => {
                let maxA = a.tiers.length ? Math.max(...a.tiers.map(t => getScore(t.tier))) : 0;
                let maxB = b.tiers.length ? Math.max(...b.tiers.map(t => getScore(t.tier))) : 0;
                return maxA !== maxB ? maxB - maxA : b.tiers.length - a.tiers.length;
            });

            let list = currentFilter === 'Overall' ? players : players.filter(p => p.tiers.some(t => t.gm === currentFilter));
            let tbody = document.getElementById('playerTableBody');

            if(list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #64748b; padding: 20px;">No players found.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            list.forEach((p, idx) => {
                let tiersHTML = p.tiers.map(t => `<div class="tier-card"><span class="gm-icon">${t.gm}</span><span class="tier-val">${t.tier}</span></div>`).join('');
                tbody.innerHTML += `
                    <tr>
                        <td class="rank">${idx + 1}</td>
                        <td>
                            <div class="player-info">
                                <div class="player-avatar"><img src="https://minotar.net/avatar/${p.ign}/50.png" onerror="this.src='https://minotar.net/avatar/Steve/50.png'"></div>
                                <span class="player-name">${p.ign}</span>
                            </div>
                        </td>
                        <td><span class="region-badge">${p.region}</span></td>
                        <td><div class="player-tiers">${tiersHTML}</div></td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
