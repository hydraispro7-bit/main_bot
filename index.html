<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OceanTiers Leaderboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0e; color: #fff; }
        
        /* Navbar */
        header { display: flex; justify-content: space-between; align-items: center; background: #121216; padding: 15px 30px; border-bottom: 1px solid #222; }
        .logo { font-size: 20px; font-weight: bold; color: #ff4747; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }
        .search-box input { background: #1a1a20; border: 1px solid #2d2d38; padding: 8px 15px; border-radius: 6px; color: #fff; font-size: 13px; width: 220px; outline: none; }

        /* Gamemodes Bar */
        .gamemodes-bar { display: flex; gap: 10px; background: #141419; padding: 12px 30px; overflow-x: auto; border-bottom: 1px solid #222; scrollbar-width: none; }
        .gamemodes-bar::-webkit-scrollbar { display: none; }
        .gm-tab { background: #1d1d24; border: 1px solid #2a2a35; padding: 8px 16px; border-radius: 6px; color: #bbb; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; font-weight: 500; }
        .gm-tab:hover { background: #262630; color: #fff; }
        .gm-tab.active { background: #ff4747; border-color: #ff4747; color: #fff; }

        /* Overall Table Styles */
        .table-container { padding: 25px 30px; max-width: 1600px; margin: 0 auto; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #888; font-size: 12px; font-weight: 600; padding: 12px 15px; border-bottom: 1px solid #222; }
        td { padding: 14px 15px; border-bottom: 1px solid #181820; font-size: 14px; }
        tr:hover { background: #121216; }
        .rank-num { font-weight: bold; color: #888; width: 40px; }
        .player-cell { display: flex; align-items: center; gap: 12px; }
        .player-skin { width: 32px; height: 32px; border-radius: 4px; background: #222; }
        .player-name { font-weight: 600; color: #fff; }
        .crown-badge { background: #f1c40f; color: #000; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 8px; }
        .region-tag { background: #1a1a22; border: 1px solid #2a2a35; color: #aaa; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .tiers-flex { display: flex; gap: 6px; flex-wrap: wrap; }
        .tier-mini-badge { background: #1a1a22; border: 1px solid #2c2c38; border-radius: 6px; padding: 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 42px; }
        .tier-mini-badge span:first-child { font-size: 9px; color: #aaa; text-transform: uppercase; font-weight: bold; }
        .tier-mini-badge span:last-child { font-size: 10px; color: #ff4747; font-weight: bold; }

        /* Normal GM Column Layout Styles */
        .tier-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; padding: 25px 30px; max-width: 1600px; margin: 0 auto; }
        .tier-column { background: #121216; border: 1px solid #1f1f28; border-radius: 10px; min-height: 500px; display: flex; flex-direction: column; overflow: hidden; }
        .tier-header { background: #181820; padding: 12px; text-align: center; font-weight: bold; font-size: 14px; color: #ff4747; border-bottom: 1px solid #1f1f28; letter-spacing: 1px; }
        .tier-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 70vh; }
        .player-card { background: #1a1a22; border: 1px solid #252530; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .badges { display: flex; align-items: center; gap: 6px; }
        .rank-badge { background: rgba(255, 71, 71, 0.15); color: #ff4747; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .no-players, .no-data { text-align: center; color: #666; padding: 40px; font-style: italic; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">⚔️ OCEANTIERS</div>
        <div class="nav-links">
            <a href="#" class="active">🏆 Rankings</a>
            <a href="https://discord.gg/gQmKg7XSTD" target="_blank">💬 Discords</a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search player IGN..." onkeyup="renderLeaderboard()">
        </div>
    </header>

    <!-- All 10 Gamemodes Tabs + Overall -->
    <div class="gamemodes-bar" id="gamemodesBar">
        <div class="gm-tab active" onclick="changeTab('overall', this)">🏆 Overall</div>
        <div class="gm-tab" onclick="changeTab('sword', this)">⚔️ Sword</div>
        <div class="gm-tab" onclick="changeTab('nethpot', this)">🧪 NethPot</div>
        <div class="gm-tab" onclick="changeTab('smp', this)">🌍 SMP</div>
        <div class="gm-tab" onclick="changeTab('diapot', this)">💎 DiaPot</div>
        <div class="gm-tab" onclick="changeTab('crystal', this)">🔮 Crystal</div>
        <div class="gm-tab" onclick="changeTab('mace', this)">🔨 Mace</div>
        <div class="gm-tab" onclick="changeTab('spear', this)">🔱 Spear</div>
        <div class="gm-tab" onclick="changeTab('uhc', this)">❤️ UHC</div>
        <div class="gm-tab" onclick="changeTab('axe', this)">🪓 Axe</div>
        <div class="gm-tab" onclick="changeTab('cart', this)">🛒 Cart</div>
    </div>

    <!-- Main Content Area -->
    <div id="mainContent"></div>

    <script>
        let allRanksData = {};
        let currentTab = 'overall';

        async function fetchData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                allRanksData = data.ranks || {};
                renderLeaderboard();
            } catch (err) {
                console.error('Error fetching data:', err);
            }
        }

        function changeTab(tabName, element) {
            document.querySelectorAll('.gm-tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            currentTab = tabName;
            renderLeaderboard();
        }

        function getTierWeight(rankStr) {
            if (!rankStr) return 99;
            const match = rankStr.match(/([HL]T)[_\s]?([1-5])/i);
            if (!match) return 50;
            const tierNum = parseInt(match[2]);
            const isHigh = match[1].toUpperCase() === 'HT';
            return (tierNum - 1) * 2 + (isHigh ? 0 : 1);
        }

        function renderLeaderboard() {
            const container = document.getElementById('mainContent');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            if (currentTab === 'overall') {
                // Render Table View for Overall
                container.innerHTML = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <<tr><th style="width: 60px;">#</th><th>PLAYER</th><th style="width: 120px;">REGION</th><th>TIERS</th></tr>
                            </thead>
                            <tbody id="overallTableBody"><tr><td colspan="4" class="no-data">Loading...</td></tr></tbody>
                        </table>
                    </div>`;

                let playersMap = {};
                Object.values(allRanksData).forEach(item => {
                    const ign = item.ign;
                    if (!playersMap[ign]) {
                        playersMap[ign] = { ign: ign, region: item.region || 'NA', tiers: {}, totalWeight: 0, count: 0 };
                    }
                    playersMap[ign].tiers[item.gamemode] = item.rank;
                    playersMap[ign].totalWeight += getTierWeight(item.rank);
                    playersMap[ign].count += 1;
                    if (item.region) playersMap[ign].region = item.region;
                });

                let playersArray = Object.values(playersMap);
                playersArray.sort((a, b) => (a.totalWeight / a.count) - (b.totalWeight / b.count));

                if (searchQuery) {
                    playersArray = playersArray.filter(p => p.ign.toLowerCase().includes(searchQuery));
                }

                const tbody = document.getElementById('overallTableBody');
                if (playersArray.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="no-data">No players found</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                playersArray.forEach((player, index) => {
                    const skinUrl = `https://cravatar.eu/helmhead/${player.ign}/32.png`;
                    let crownTag = index === 0 ? `<span class="crown-badge">👑 #1</span>` : '';

                    let tiersHtml = '';
                    for (let [gm, rankName] of Object.entries(player.tiers)) {
                        const isHigh = rankName.toLowerCase().includes('high');
                        const matchNum = rankName.match(/[1-5]/);
                        const num = matchNum ? matchNum[0] : '3';
                        tiersHtml += `<div class="tier-mini-badge"><span>${gm}</span><span>${isHigh ? 'HT' : 'LT'}${num}</span></div>`;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td class="rank-num">${index + 1}</td>
                            <td><div class="player-cell"><img src="${skinUrl}" class="player-skin" onerror="this.src='https://cravatar.eu/helmhead/MHF_Steve/32.png'"><span class="player-name">${player.ign}</span>${crownTag}</div></td>
                            <td><span class="region-tag">${player.region}</span></td>
                            <td><div class="tiers-flex">${tiersHtml}</div></td>
                        </tr>`;
                });

            } else {
                // Render 5 Columns View for specific Gamemode
                container.innerHTML = `
                    <div class="tier-container">
                        ${[1,2,3,4,5].map(i => `
                            <div class="tier-column">
                                <div class="tier-header">TIER ${i}</div>
                                <div class="tier-body" id="tier${i}-list"><div class="no-players">No players</div></div>
                            </div>
                        `).join('')}
                    </div>`;

                for (let i = 1; i <= 5; i++) {
                    document.getElementById(`tier${i}-list`).innerHTML = '<div class="no-players">No players</div>';
                }

                Object.values(allRanksData).forEach(player => {
                    if (player.gamemode !== currentTab) return;
                    if (searchQuery && !player.ign.toLowerCase().includes(searchQuery)) return;

                    let tierNum = 5;
                    if (player.rank.includes('1')) tierNum = 1;
                    else if (player.rank.includes('2')) tierNum = 2;
                    else if (player.rank.includes('3')) tierNum = 3;
                    else if (player.rank.includes('4')) tierNum = 4;
                    else if (player.rank.includes('5')) tierNum = 5;

                    const tierBody = document.getElementById(`tier${tierNum}-list`);
                    if (tierBody.querySelector('.no-players')) tierBody.innerHTML = '';

                    const isHigh = player.rank.toLowerCase().includes('high');
                    const shortRank = `${isHigh ? 'HT' : 'LT'}${tierNum}`;
                    const skinUrl = `https://cravatar.eu/helmhead/${player.ign}/30.png`;

                    tierBody.innerHTML += `
                        <div class="player-card">
                            <div class="player-info">
                                <img src="${skinUrl}" class="player-skin" style="width:28px;height:28px;border-radius:4px;" onerror="this.src='https://cravatar.eu/helmhead/MHF_Steve/30.png'">
                                <span style="font-size:13px;font-weight:600;color:#eee;">${player.ign}</span>
                            </div>
                            <div class="badges">
                                <span class="rank-badge">${shortRank}</span>
                                <span style="background:#22222a;color:#888;font-size:10px;font-weight:bold;padding:2px 5px;border-radius:4px;">${player.region || 'NA'}</span>
                            </div>
                        </div>`;
                });
            }
        }

        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
